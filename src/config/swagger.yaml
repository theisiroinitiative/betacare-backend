components:
  securitySchemes:
    AccessTokenAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Access JWT token required for user, practitioner, organization, department, and admin protected operations.
    PasswordResetTokenAuth:
      type: apiKey
      in: cookie
      name: password_reset_token
      description: Password reset verification JWT token. Required for the final password reset request.

  schemas:
    UserAuthRegister:
      type: object
      required: [firstname, lastname, email, password, phoneNumber]
      properties:
        firstname:
          type: string
          example: John
        lastname:
          type: string
          example: Doe
        email:
          type: string
          format: email
