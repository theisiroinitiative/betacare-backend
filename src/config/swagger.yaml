openapi: 3.0.0
info:
  title: BetaCare Integration & Authentication API
  description: API Documentation for BetaCare user auth, patient health profiles, hospital/organization integration, department onboarding, and practitioner management.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server

security: []

paths:
  /auth/user/new:
    post:
      tags:
        - User Authentication
      summary: Stage 1 onboarding registration
      description: Register a new patient account. An email OTP will be sent to verify the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthRegister'
      responses:
        '201':
          description: Registration successful, OTP sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/verify:
    put:
      tags:
        - User Authentication
      summary: Verify email OTP code
      description: Verify the email address using the 6-digit OTP code sent during registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
      responses:
        '200':
          description: OTP verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/verify-account:
    post:
      tags:
        - User Authentication
      summary: Verify account to initiate forgot password flow
      description: Request a password reset OTP code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccount'
      responses:
        '200':
          description: Verification OTP sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation or account error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/verify-email:
    post:
      tags:
        - User Authentication
      summary: Verify OTP for password reset
      description: Verify the reset OTP to receive a short-lived `password_reset_token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
      responses:
        '200':
          description: Email verified successfully. Sets `password_reset_token` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully. Proceed to reset password.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: password_reset_token=abc123xyz...; Path=/; HttpOnly; Secure; SameSite=None
        '400':
          description: Invalid or expired OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/password-reset:
    put:
      tags:
        - User Authentication
      summary: Reset user password
      description: Set a new password for the user. Requires a valid `password_reset_token` cookie.
      security:
        - PasswordResetTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: Password reset successful. Clears the password reset cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid password reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/login:
    post:
      tags:
        - User Authentication
      summary: User login
      description: Authenticate user using email and password. Sets `access_token` and `refresh_token` cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful. Cookies set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=jwt_access_token...; Path=/; HttpOnly; Secure; SameSite=None
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/renew-token:
    get:
      tags:
        - User Authentication
      summary: Renew user access token
      description: Renew `access_token` using the active `refresh_token` stored in cookies.
      responses:
        '200':
          description: Access token renewed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=new_jwt_access_token...; Path=/; HttpOnly; Secure; SameSite=None
        '401':
          description: Unauthorized. Missing or invalid refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/logout:
    put:
      tags:
        - User Authentication
      summary: User logout
      description: Log out the user and clear authorization cookies.
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/delete:
    delete:
      tags:
        - User Authentication
      summary: Delete user account (Protected)
      description: Permenantly delete patient auth record, profile, and associated history.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Account deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized. Invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/onboard:
    post:
      tags:
        - Patient Profile CRUD
      summary: Complete Stage 2 Onboarding (Protected)
      description: Create the detailed user health profile and generate a WhatsApp agent code.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileOnboard'
      responses:
        '200':
          description: Onboarding complete. WhatsApp code generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardResponse'
        '400':
          description: Validation error or profile already onboarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/resend-whatsapp-code:
    post:
      tags:
        - Patient Profile CRUD
      summary: Resend/regenerate WhatsApp agent verification code (Protected)
      description: Generate a new 24-hour expiring WhatsApp verification code if the previous code expired.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: WhatsApp verification code regenerated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardResponse'
        '401':
          description: Unauthorized. Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Health profile not found. User must onboard first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile:
    get:
      tags:
        - Patient Profile CRUD
      summary: Retrieve full patient health profile
      description: Retrieve demographics, medical conditions, medications, vitals, reminders, and observations.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized. Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Health profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Patient Profile CRUD
      summary: Update patient demographics
      description: Update patient demographics and emergency contact details.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Demographics updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemographicsUpdateResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/link-practitioner:
    post:
      tags:
        - Patient Profile CRUD
      summary: Link a medical practitioner to user profile
      description: Link a practitioner ID to enable them to view and manage health records.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPractitioner'
      responses:
        '200':
          description: Practitioner successfully linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPractitionerResponse'
        '400':
          description: Validation or entity error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/unlink-practitioner:
    post:
      tags:
        - Patient Profile CRUD
      summary: Unlink a medical practitioner from user profile
      description: Remove linking for a practitioner to revoke access to health records.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPractitioner'
      responses:
        '200':
          description: Practitioner successfully unlinked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlinkPractitionerResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/conditions:
    get:
      tags:
        - Patient Health Records
      summary: Get user medical conditions list
      description: Retrieve all recorded medical conditions.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Successfully fetched conditions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Condition'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Patient Health Records
      summary: Add new medical condition to profile
      description: Add a new medical condition record to patient profile.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionInput'
      responses:
        '201':
          description: Medical condition successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionCreateResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/conditions/{id}:
    put:
      tags:
        - Patient Health Records
      summary: Update medical condition severity/status
      description: Update severity and/or status of a medical condition record.
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the condition record.
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionUpdateInput'
      responses:
        '200':
          description: Condition updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionCreateResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Condition record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Patient Health Records
      summary: Delete medical condition from profile
      description: Permanently remove a medical condition record.
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the condition record.
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '200':
          description: Condition deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Condition record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/medications:
    get:
      tags:
        - Patient Health Records
      summary: Get user medications list
      description: Retrieve all medications recorded on profile.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Successfully fetched medications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Patient Health Records
      summary: Add new medication to profile
      description: Record a new medication on the profile.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '201':
          description: Medication successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationCreateResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/medications/{id}:
    put:
      tags:
        - Patient Health Records
      summary: Update medication details
      description: Update dosage, frequency, and/or end date of an existing medication record.
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the medication record.
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationUpdateInput'
      responses:
        '200':
          description: Medication updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationUpdateResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Medication record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Patient Health Records
      summary: Delete medication from profile
      description: Permanently remove a medication record.
      security:
        - AccessTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the medication record.
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '200':
          description: Medication deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Medication record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/vitals:
    get:
      tags:
        - Patient Health Records
      summary: Get vital logs
      description: Retrieve historical logged vital measurements.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Successfully fetched vitals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VitalLog'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Patient Health Records
      summary: Log new vital measurements manually
      description: Log stats such as BMI, blood pressure, blood sugar, temperature, or pulse.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalLogInput'
      responses:
        '201':
          description: Vital measurements logged successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalLogCreateResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/medication-logs:
    get:
      tags:
        - Patient Health Records
      summary: Get medication logs
      description: Retrieve adherence tracking history for medications.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Successfully fetched logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationLog'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Patient Health Records
      summary: Log medication adherence/intake manually
      description: Log whether a specific medication was taken, missed, or skipped.
      security:
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationLogInput'
      responses:
        '201':
          description: Medication intake logged successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationLogCreateResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user/profile/observations:
    get:
      tags:
        - Patient Health Records
      summary: View AI observations recorded via bot
      description: Retrieve automated symptom observations logged by the AI chat agent.
      security:
        - AccessTokenAuth: []
      responses:
        '200':
          description: Successfully fetched observations.
          content:
            application/json:
